<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site</title>
<style>
  *{ box-sizing: border-box; margin: 0; padding: 0; }

  body{
    min-height: 100vh;
    background: #0a0a0a;
    color: #ffffff;
    font-family: system-ui, sans-serif;
  }

  /* Language switcher (top-left) */
  .lang-switcher{
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 100;
    font-size: 14px;
  }

  .lang-current{
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    color: #ffffff;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
  }

  .lang-current .arrow{
    display: inline-block;
    transition: transform 0.2s ease;
    font-size: 10px;
  }

  .lang-switcher.open .arrow{
    transform: rotate(180deg);
  }

  .lang-list{
    display: none;
    flex-direction: column;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    min-width: 100%;
    background: #141414;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    overflow: hidden;
  }

  .lang-switcher.open .lang-list{
    display: flex;
  }

  .lang-option{
    padding: 8px 12px;
    cursor: pointer;
    white-space: nowrap;
    color: #ffffff;
  }

  .lang-option:hover{
    background: rgba(255,255,255,0.08);
  }

  .lang-option.active{
    color: #7ce0a8;
  }
</style>
</head>
<body>

  <!-- Language switcher -->
  <div class="lang-switcher" id="langSwitcher">
    <div class="lang-current" id="langCurrent">
      <span id="langLabel">EN</span>
      <span class="arrow">▼</span>
    </div>
    <div class="lang-list">
      <div class="lang-option active" data-lang="en">EN</div>
      <div class="lang-option" data-lang="ru">RU</div>
    </div>
  </div>

  <!-- Background music: autoplays muted, unmutes on first interaction -->
  <audio id="bgMusic" src="music.mp3" loop autoplay muted></audio>

  <script>
    // ---------- Language switcher ----------
    const langSwitcher = document.getElementById('langSwitcher');
    const langCurrent = document.getElementById('langCurrent');
    const langLabel = document.getElementById('langLabel');
    const langOptions = document.querySelectorAll('.lang-option');
    const htmlRoot = document.getElementById('htmlRoot');

    langCurrent.addEventListener('click', () => {
      langSwitcher.classList.toggle('open');
    });

    langOptions.forEach(option => {
      option.addEventListener('click', () => {
        const chosen = option.getAttribute('data-lang');

        langOptions.forEach(o => o.classList.remove('active'));
        option.classList.add('active');

        langLabel.textContent = chosen.toUpperCase();
        htmlRoot.setAttribute('lang', chosen);

        langSwitcher.classList.remove('open');
      });
    });

    document.addEventListener('click', (e) => {
      if(!langSwitcher.contains(e.target)){
        langSwitcher.classList.remove('open');
      }
    });

    // ---------- Background music: unmute on first user interaction ----------
    const bgMusic = document.getElementById('bgMusic');

    function unmuteOnce(){
      bgMusic.muted = false;
      bgMusic.play().catch(() => {});
      document.removeEventListener('click', unmuteOnce);
      document.removeEventListener('keydown', unmuteOnce);
    }

    document.addEventListener('click', unmuteOnce);
    document.addEventListener('keydown', unmuteOnce);
  </script>

</body>
</html>
